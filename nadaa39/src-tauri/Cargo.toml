[package]
name = "nadaa39"
version = "0.1.0"
description = "Nadaa 39 desktop shell"
authors = ["Ramatema Pule"]
edition = "2021"

[lib]
name = "nadaa39_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }

default-run = "nadaa39"
